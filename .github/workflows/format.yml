on:
  push:
    branches: [ dev, main ]
  pull_request:

# Auto cancel previous runs if they were not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Rust format

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - run: rustup component add rustfmt

      - name: Check code format
        run: |
          cargo fmt --all -- --check

      - name: Install cargo-hack
        run: |
          cargo install -f cargo-hack
    
      - name: Check all features
        run: |
          # Every feature except model-signatures, which by design refuses to
          # compile until the production root public keys are embedded
          # (threatmodels-rs authenticity.rs).
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="threatmodels_rs") | .features | keys
                     | map(select(. != "model-signatures" and . != "default")) | join(",")')
          cargo hack check --features "$features" --all-targets
